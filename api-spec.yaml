openapi: 3.0.3
info:
  title: ホットペッパー グルメ検索 API
  description: |
    ホットペッパーグルメAPIをプロキシするバックエンドAPIの仕様書です。
    レストラン検索とジャンルマスター取得の機能を提供します。
  version: 1.0.0
  contact:
    name: API Support

servers:
  - url: http://localhost:8080
    description: ローカル開発環境
  - url: http://localhost:8080/api
    description: APIベースパス

tags:
  - name: gourmet
    description: グルメ検索関連のエンドポイント
  - name: genre
    description: ジャンルマスター関連のエンドポイント

paths:
  /api/gourmet:
    get:
      tags:
        - gourmet
      summary: レストラン検索
      description: |
        指定された条件でレストランを検索します。
        `lat` と `lng` を指定した現在地検索、または `address` / `keyword` による検索が可能です。
        少なくとも以下のいずれか 1 つが必要です。
        - `lat` と `lng` の組み合わせ
        - `address`
        - `keyword`
        バックエンドは常に以下のパラメータをホットペッパーAPIに付与します：
        - `format=json`: JSON形式でレスポンスを取得
        - `type=lite+credit_card`: 軽量版 + クレジットカード情報を含むレスポンス形式を使用
      operationId: searchRestaurants
      parameters:
        - name: lat
          in: query
          description: 緯度（現在地検索時に使用。`lng` とセットで指定）
          schema:
            type: number
            format: double
          example: 35.6895
        - name: lng
          in: query
          description: 経度（現在地検索時に使用。`lat` とセットで指定）
          schema:
            type: number
            format: double
          example: 139.6917
        - name: range
          in: query
          description: 検索範囲（`lat/lng` 指定時のみ有効、1〜5）
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5
            default: 3
          example: 3
        - name: address
          in: query
          description: 住所（部分一致検索）
          required: false
          schema:
            type: string
          example: 新宿
        - name: genre
          in: query
          description: ジャンルコード
          required: false
          schema:
            type: string
          example: G001
        - name: keyword
          in: query
          description: 検索キーワード（店名、キャッチ等）
          required: false
          schema:
            type: string
          example: 個室
        - name: start
          in: query
          description: 検索結果の開始位置（1以上1000以下）
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
          example: 1
        - name: count
          in: query
          description: 取得件数（1以上100以下）
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
      responses:
        '200':
          description: 検索成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GourmetSearchResponse'
              example:
                results:
                  api_version: "1.26"
                  results_available: 150
                  results_returned: "20"
                  results_start: 1
                  shop:
                    - id: "J001234567"
                      name: "○○レストラン 新宿店"
                      address: "東京都新宿区新宿1-2-3"
                      lat: 35.6895
                      lng: 139.6917
                      genre:
                        name: "イタリアン・フレンチ"
                        catch: "本格イタリアンを堪能"
                      catch: "こだわりの食材で作る絶品料理"
                      access: "JR新宿駅東口 徒歩5分"
                      urls:
                        pc: "https://www.hotpepper.jp/..."
                      photo:
                        pc:
                          l: "https://imgfp.hotp.jp/.../large.jpg"
                          m: "https://imgfp.hotp.jp/.../medium.jpg"
                          s: "https://imgfp.hotp.jp/.../small.jpg"
                      credit_card:
                        - code: "VISA"
                          name: "VISA"
                        - code: "MASTER"
                          name: "MasterCard"
        '400':
          description: リクエストパラメータエラー
          content:
            text/plain:
              schema:
                type: string
              example: "either lat/lng, address, or keyword must be provided"
        '500':
          description: サーバーエラー
          content:
            text/plain:
              schema:
                type: string
              example: "Failed to fetch data"

  /api/genre:
    get:
      tags:
        - genre
      summary: ジャンルマスター取得
      description: |
        利用可能なレストランジャンルの一覧を取得します。
        結果はキャッシュ推奨です。
        バックエンドは常に `format=json` パラメータをホットペッパーAPIに付与します。
      operationId: getGenres
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreMasterResponse'
              example:
                results:
                  api_version: "1.26"
                  results_available: 50
                  results_returned: "50"
                  results_start: 1
                  genre:
                    - code: "G001"
                      name: "居酒屋"
                    - code: "G002"
                      name: "ダイニングバー・バル"
                    - code: "G003"
                      name: "創作料理"
        '500':
          description: サーバーエラー
          content:
            text/plain:
              schema:
                type: string
              example: "Failed to fetch data"

components:
  schemas:
    GourmetSearchResponse:
      type: object
      properties:
        results:
          type: object
          properties:
            api_version:
              type: string
              description: APIバージョン
              example: "1.26"
            results_available:
              type: integer
              description: 検索条件に該当する総件数
              example: 150
            results_returned:
              type: string
              description: 返却された件数（APIから文字列で返される）
              example: "20"
            results_start:
              type: integer
              description: 開始位置
              example: 1
            shop:
              type: array
              items:
                $ref: '#/components/schemas/Shop'

    Shop:
      type: object
      description: レストラン情報
      properties:
        id:
          type: string
          description: 店舗ID
          example: "J001234567"
        name:
          type: string
          description: 店舗名
          example: "○○レストラン 新宿店"
        address:
          type: string
          description: 住所
          example: "東京都新宿区新宿1-2-3"
        lat:
          type: number
          format: double
          description: 緯度
          example: 35.6895
        lng:
          type: number
          format: double
          description: 経度
          example: 139.6917
        genre:
          type: object
          description: ジャンル情報
          properties:
            name:
              type: string
              description: ジャンル名
              example: "イタリアン・フレンチ"
            catch:
              type: string
              description: ジャンルキャッチ
              example: "本格イタリアンを堪能"
        catch:
          type: string
          description: キャッチコピー
          example: "こだわりの食材で作る絶品料理"
        access:
          type: string
          description: アクセス情報
          example: "JR新宿駅東口 徒歩5分"
        urls:
          type: object
          description: URL情報
          properties:
            pc:
              type: string
              format: uri
              description: PC向けURL
              example: "https://www.hotpepper.jp/..."
        photo:
          type: object
          description: 写真情報
          properties:
            pc:
              type: object
              properties:
                l:
                  type: string
                  format: uri
                  description: 大サイズ画像URL
                  example: "https://imgfp.hotp.jp/.../large.jpg"
                m:
                  type: string
                  format: uri
                  description: 中サイズ画像URL
                  example: "https://imgfp.hotp.jp/.../medium.jpg"
                s:
                  type: string
                  format: uri
                  description: 小サイズ画像URL
                  example: "https://imgfp.hotp.jp/.../small.jpg"
        credit_card:
          type: array
          description: 利用可能なクレジットカード情報
          items:
            type: object
            properties:
              code:
                type: string
                description: カードコード
                example: "VISA"
              name:
                type: string
                description: カード名
                example: "VISA"

    GenreMasterResponse:
      type: object
      properties:
        results:
          type: object
          properties:
            api_version:
              type: string
              description: APIバージョン
              example: "1.26"
            results_available:
              type: integer
              description: 総件数
              example: 50
            results_returned:
              type: string
              description: 返却された件数（APIから文字列で返される）
              example: "50"
            results_start:
              type: integer
              description: 開始位置
              example: 1
            genre:
              type: array
              items:
                $ref: '#/components/schemas/Genre'

    Genre:
      type: object
      description: ジャンル情報
      properties:
        code:
          type: string
          description: ジャンルコード
          example: "G001"
        name:
          type: string
          description: ジャンル名
          example: "居酒屋"
