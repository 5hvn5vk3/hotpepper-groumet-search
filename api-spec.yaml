openapi: 3.0.3
info:
  title: ホットペッパー グルメ検索 API
  description: |
    ホットペッパーグルメAPIをプロキシするバックエンドAPIの仕様書です。
    レストラン検索とジャンルマスター取得の機能を提供します。
  version: 1.0.0
  contact:
    name: API Support

servers:
  - url: http://localhost:8080
    description: ローカル開発環境
  - url: http://localhost:8080/api
    description: APIベースパス

tags:
  - name: gourmet
    description: グルメ検索関連のエンドポイント
  - name: genre
    description: ジャンルマスター関連のエンドポイント

paths:
  /api/gourmet:
    get:
      tags:
        - gourmet
      summary: レストラン検索
      description: |
        指定された条件でレストランを検索します。
        service_areaは必須パラメータです。
        バックエンドは常に以下のパラメータをホットペッパーAPIに付与します：
        - `format=json`: JSON形式でレスポンスを取得
        - `type=lite`: 軽量版のレスポンス形式を使用
      operationId: searchRestaurants
      parameters:
        - name: service_area
          in: query
          description: サービスエリアコード（都道府県コード）
          required: true
          schema:
            type: string
            enum:
              - SA11  # 東京
              - SA12  # 神奈川
              - SA13  # 埼玉
              - SA14  # 千葉
              - SA15  # 茨城
              - SA16  # 栃木
              - SA17  # 群馬
              - SA21  # 滋賀
              - SA22  # 京都
              - SA23  # 大阪
              - SA24  # 兵庫
              - SA25  # 奈良
              - SA26  # 和歌山
              - SA31  # 岐阜
              - SA32  # 静岡
              - SA33  # 愛知
              - SA34  # 三重
              - SA41  # 北海道
              - SA51  # 青森
              - SA52  # 岩手
              - SA53  # 宮城
              - SA54  # 秋田
              - SA55  # 山形
              - SA56  # 福島
              - SA61  # 新潟
              - SA62  # 富山
              - SA63  # 石川
              - SA64  # 福井
              - SA65  # 山梨
              - SA66  # 長野
              - SA71  # 鳥取
              - SA72  # 島根
              - SA73  # 岡山
              - SA74  # 広島
              - SA75  # 山口
              - SA81  # 徳島
              - SA82  # 香川
              - SA83  # 愛媛
              - SA84  # 高知
              - SA91  # 福岡
              - SA92  # 佐賀
              - SA93  # 長崎
              - SA94  # 熊本
              - SA95  # 大分
              - SA96  # 宮崎
              - SA97  # 鹿児島
              - SA98  # 沖縄
          example: SA11
        - name: address
          in: query
          description: 住所（部分一致検索）
          required: false
          schema:
            type: string
          example: 新宿
        - name: genre
          in: query
          description: ジャンルコード
          required: false
          schema:
            type: string
          example: G001
        - name: keyword
          in: query
          description: 検索キーワード（店名、キャッチ等）
          required: false
          schema:
            type: string
          example: 個室
        - name: start
          in: query
          description: 検索結果の開始位置（1以上1000以下）
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
          example: 1
        - name: count
          in: query
          description: 取得件数（1以上100以下）
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
      responses:
        '200':
          description: 検索成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GourmetSearchResponse'
              example:
                results:
                  api_version: "1.26"
                  results_available: 150
                  results_returned: "20"
                  results_start: 1
                  shop:
                    - id: "J001234567"
                      name: "○○レストラン 新宿店"
                      address: "東京都新宿区新宿1-2-3"
                      lat: 35.6895
                      lng: 139.6917
                      genre:
                        name: "イタリアン・フレンチ"
                        catch: "本格イタリアンを堪能"
                      catch: "こだわりの食材で作る絶品料理"
                      access: "JR新宿駅東口 徒歩5分"
                      urls:
                        pc: "https://www.hotpepper.jp/..."
                      photo:
                        pc:
                          l: "https://imgfp.hotp.jp/.../large.jpg"
                          m: "https://imgfp.hotp.jp/.../medium.jpg"
                          s: "https://imgfp.hotp.jp/.../small.jpg"
        '400':
          description: リクエストパラメータエラー
          content:
            text/plain:
              schema:
                type: string
              example: "service_area is required"
        '500':
          description: サーバーエラー
          content:
            text/plain:
              schema:
                type: string
              example: "Failed to fetch data"

  /api/genre:
    get:
      tags:
        - genre
      summary: ジャンルマスター取得
      description: |
        利用可能なレストランジャンルの一覧を取得します。
        結果はキャッシュ推奨です。
        バックエンドは常に `format=json` パラメータをホットペッパーAPIに付与します。
      operationId: getGenres
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreMasterResponse'
              example:
                results:
                  api_version: "1.26"
                  results_available: 50
                  results_returned: "50"
                  results_start: 1
                  genre:
                    - code: "G001"
                      name: "居酒屋"
                    - code: "G002"
                      name: "ダイニングバー・バル"
                    - code: "G003"
                      name: "創作料理"
        '500':
          description: サーバーエラー
          content:
            text/plain:
              schema:
                type: string
              example: "Failed to fetch data"

components:
  schemas:
    GourmetSearchResponse:
      type: object
      properties:
        results:
          type: object
          properties:
            api_version:
              type: string
              description: APIバージョン
              example: "1.26"
            results_available:
              type: integer
              description: 検索条件に該当する総件数
              example: 150
            results_returned:
              type: string
              description: 返却された件数（APIから文字列で返される）
              example: "20"
            results_start:
              type: integer
              description: 開始位置
              example: 1
            shop:
              type: array
              items:
                $ref: '#/components/schemas/Shop'

    Shop:
      type: object
      description: レストラン情報
      properties:
        id:
          type: string
          description: 店舗ID
          example: "J001234567"
        name:
          type: string
          description: 店舗名
          example: "○○レストラン 新宿店"
        address:
          type: string
          description: 住所
          example: "東京都新宿区新宿1-2-3"
        lat:
          type: number
          format: double
          description: 緯度
          example: 35.6895
        lng:
          type: number
          format: double
          description: 経度
          example: 139.6917
        genre:
          type: object
          description: ジャンル情報
          properties:
            name:
              type: string
              description: ジャンル名
              example: "イタリアン・フレンチ"
            catch:
              type: string
              description: ジャンルキャッチ
              example: "本格イタリアンを堪能"
        catch:
          type: string
          description: キャッチコピー
          example: "こだわりの食材で作る絶品料理"
        access:
          type: string
          description: アクセス情報
          example: "JR新宿駅東口 徒歩5分"
        urls:
          type: object
          description: URL情報
          properties:
            pc:
              type: string
              format: uri
              description: PC向けURL
              example: "https://www.hotpepper.jp/..."
        photo:
          type: object
          description: 写真情報
          properties:
            pc:
              type: object
              properties:
                l:
                  type: string
                  format: uri
                  description: 大サイズ画像URL
                  example: "https://imgfp.hotp.jp/.../large.jpg"
                m:
                  type: string
                  format: uri
                  description: 中サイズ画像URL
                  example: "https://imgfp.hotp.jp/.../medium.jpg"
                s:
                  type: string
                  format: uri
                  description: 小サイズ画像URL
                  example: "https://imgfp.hotp.jp/.../small.jpg"

    GenreMasterResponse:
      type: object
      properties:
        results:
          type: object
          properties:
            api_version:
              type: string
              description: APIバージョン
              example: "1.26"
            results_available:
              type: integer
              description: 総件数
              example: 50
            results_returned:
              type: string
              description: 返却された件数（APIから文字列で返される）
              example: "50"
            results_start:
              type: integer
              description: 開始位置
              example: 1
            genre:
              type: array
              items:
                $ref: '#/components/schemas/Genre'

    Genre:
      type: object
      description: ジャンル情報
      properties:
        code:
          type: string
          description: ジャンルコード
          example: "G001"
        name:
          type: string
          description: ジャンル名
          example: "居酒屋"